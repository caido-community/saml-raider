[tools]
node = "24.11.1"
pnpm = "11.18.0"

[tasks.format]
description = "Format the repository with prettier"
run = "pnpm format"

[tasks.validate]
description = "Run all quality checks (typecheck, lint, format, knip, test)"
run = """
pnpm install --frozen-lockfile
pnpm typecheck
pnpm lint
pnpm format:check
pnpm knip
pnpm test
"""

[tasks.build]
description = "Build the plugin package"
run = """
pnpm install --frozen-lockfile
pnpm build
"""
